  # Regular mention routes - triggered by @agent mentions without /assign.
  - name: mention-claude
    access: readonly
    match:
      event: "Note Hook"
      action: "create"
      author: "your-username"
      mentions: ["claude"]
    agents:
      - agent: "claude"
        task: "note_followup"
        prompt: "note_followup.txt"
        options:
          command: "claude"
          args: ["--model", "${CLAUDE_MODEL}", "--dangerously-skip-permissions", "-p"]
  - name: mention-gemini
    access: readonly
    match:
