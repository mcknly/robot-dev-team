        prompt: "merge_request_review.txt"
        options:
          command: "agy"
          args: ["--model", "${GEMINI_MODEL}", "--dangerously-skip-permissions", "-p", "${PROMPT}"]
      - agent: "codex"
        task: "merge_request_review"
        prompt: "merge_request_review.txt"
        options:
          command: "codex"
          args: ["--model", "${CODEX_MODEL}", "exec", "--yolo", "--skip-git-repo-check"]
