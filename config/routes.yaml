#
# Note the trigger and the agent are deliberately different strings: `assignees`
# matches the GitLab *username* from the webhook payload (`gemma`), while `agent`
# is the slug that resolves GOOSE_GEMMA_MODEL + GOOSE_GEMMA_AGENT_* (`goose-gemma`).
# Same split as the opencode-kimi / `kimi` pair -- the harness prefix stays out of
# the GitLab account name.
#
# A local model can go quiet for a long prefill, so the inactivity watchdog is
# raised above the 900s default here to keep a run from being killed mid-think.
