#          args: ["--model", "${GROK_MODEL}", "--no-auto-update", "--always-approve", "-p", "${PROMPT}"]
  - name: issue-triage
    access: readonly
    randomize: true
# Uncomment together with the goose or grok entries below -- both go quiet for
# long stretches (a local model during prefill; grok's `plain` format, which
# prints nothing until the run ends) and the watchdog only resets on stdout.
# Applies to every agent on this route, which is harmless: it only widens the
# silence they are allowed before being killed.
#    max_inactivity_seconds: 1800
    match:
      event: "Issue Hook"
      action: "open"
      author: "your-username"
    agents:
      - agent: "claude"
        task: "issue_review"
        prompt: "issue_review.txt"
        options:
          command: "claude"
          args: ["--model", "${CLAUDE_MODEL}", "--dangerously-skip-permissions", "-p"]
      - agent: "gemini"
        task: "issue_review"
        prompt: "issue_review.txt"
        options:
          command: "agy"
          args: ["--model", "${GEMINI_MODEL}", "--dangerously-skip-permissions", "-p", "${PROMPT}"]
      - agent: "codex"
        task: "issue_review"
        prompt: "issue_review.txt"
        options:
          command: "codex"
          args: ["--model", "${CODEX_MODEL}", "exec", "--yolo", "--skip-git-repo-check"]
# OpenCode issue-review entry (optional, disabled by default). The shared
# `opencode` binary backs each opencode-<model> agent. To enable, strip the
# leading `#` from the lines below (it sits at column 0 so removing it restores
# the correct YAML indentation). See docs/ROUTES.md.
#      - agent: "opencode-kimi"
#        task: "issue_review"
#        prompt: "issue_review.txt"
#        options:
#          command: "opencode"
#          args: ["run", "--model", "${OPENCODE_KIMI_MODEL}", "--format", "json", "--auto"]
# Goose issue-review entry (optional, disabled by default). Strip the leading
# `#` (column 0) from the lines below to enable. Like OpenCode, the single
# `goose` binary backs many logical agents, so each is named after its model
# (`goose-gemma` here) and resolves its own GOOSE_GEMMA_* env vars. Add another
# by cloning these blocks with a new suffix, e.g. `goose-qwen`.
#
# Goose takes the prompt on stdin (`-i -`) and `--no-session` keeps webhook runs
# from accumulating session state. Provider and extensions come from the host
# config dir mounted in docker-compose.yml -- do NOT add `--provider` here:
# routes only substitute ${VAR} in the argument right after `--model`, so any
# other placeholder would reach the CLI as a literal string.
# See docs/ADDING_AN_AGENT.md.
#      - agent: "goose-gemma"
#        task: "issue_review"
#        prompt: "issue_review.txt"
#        options:
#          command: "goose"
#          args: ["run", "--no-session", "--model", "${GOOSE_GEMMA_MODEL}", "-i", "-"]
# Grok Build issue-review entry (optional, disabled by default). Strip the
# leading `#` (column 0) from the lines below to enable. See docs/ROUTES.md.
#
# Grok takes the prompt as an argv value via the ${PROMPT} placeholder, the same
# way `agy` does -- it does NOT read stdin. Its `--prompt-file` flag accepts
# /dev/stdin and looks like the stdin answer (it even works under a shell
# redirect), but the dispatcher hands the child a pipe and closes the write end
# once the prompt is written; grok then re-opens fd 0 *by path*, and reopening a
# pipe with no writers left fails with ENXIO. Do not "fix" this back to
# --prompt-file. Auth comes from the host config dir mounted in
# docker-compose.yml (~/.grok/auth.json, written by `grok login`).
#
# `--no-auto-update` is not about pinning a version -- scripts/install-grok.sh
# still fetches latest at every container start. It stops the *running agent* from
# updating itself: grok's updater stages into ~/.grok/downloads and repoints
# ~/.grok/bin/{grok,agent}, and ~/.grok is bind-mounted from the host, so a
# container-side update would drop a ~150 MB binary in the operator's home and
# flip the symlink their host grok resolves through.
#
# Uncomment `max_inactivity_seconds` on the route above together with this entry:
# in the default `plain` format grok emits no stdout until the run ends, and the
# watchdog only resets on stdout. The route-level value applies to every agent on
# the route, which is harmless -- it only widens the silence they are allowed.
#      - agent: "grok"
#        task: "issue_review"
#        prompt: "issue_review.txt"
#        options:
#          command: "grok"
#          args: ["--model", "${GROK_MODEL}", "--no-auto-update", "--always-approve", "-p", "${PROMPT}"]
  - name: default-merge-request
    access: readonly
    randomize: true
# Uncomment together with the goose or grok entries below; see the note on
