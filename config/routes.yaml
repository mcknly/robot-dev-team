# Pi mention route (optional, disabled by default). Read-only like the other
# mention routes. Strip the leading `#` (column 0) to enable.
#
# Like goose-*, the GitLab username and the agent slug are deliberately different:
# `mentions` matches the GitLab *username* from the webhook payload (`nemotron`),
# while `agent` is the slug that resolves PI_NEMOTRON_MODEL + PI_NEMOTRON_AGENT_*
# (`pi-nemotron`). The harness prefix stays out of the GitLab account name.
#
# Pi takes the prompt on stdin: there is no ${PROMPT} token in args, so the
# dispatcher pipes the rendered prompt to the child (print mode `-p` merges piped
# stdin into the initial prompt). `--no-session` keeps webhook runs from writing
# session state into the bind-mounted ~/.pi/agent, and `--no-approve` stops an
# untrusted repo/branch from opting itself into executable Pi extensions. Provider
# auth (the OpenRouter key) comes from the host config dir mounted in
# docker-compose.yml (~/.pi/agent/auth.json), not from an env key. Only the arg
# right after `--model` is substituted, so keep ${PI_NEMOTRON_MODEL} in that slot.
# A 550B model can prefill silently, so the inactivity watchdog is raised above the
# 900s default (the watchdog resets on stdout only).
