# Grok Build issue-assignment route (optional, disabled by default). Read-write
# like the other assignment routes. Strip the leading `#` (column 0) to enable.
#
# The inactivity watchdog is raised above the 900s default because Grok's plain
# output format prints the reply in one go at the end of the run: a long stretch
# of tool calls produces no stdout to reset the timer. Switch the route to
# `--output-format streaming-json` instead if you would rather have continuous
# token events (at the cost of JSON-shaped run-logs).
#  - name: assign-issue-grok
#    access: readwrite
#    max_inactivity_seconds: 1800
#    match:
