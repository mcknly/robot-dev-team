# Sample routing configuration for webhook event handling.
# See docs/ROUTES.md for detailed schema and additional examples.
#
# IMPORTANT: Replace "your-username" with your GitLab username in each route's
# author field. The author field accepts either a single string or a list of
# usernames if you want one route to be triggerable by multiple operators,
# e.g. author: ["alice", "bob"]. Matching is case-insensitive in both forms.
# For persistent local overrides, copy this file to config/routes.local.yaml,
# customise it, and set ROUTE_CONFIG_PATH in .env:
#   ROUTE_CONFIG_PATH=config/routes.local.yaml
#
# Access modes:
#   - readonly: Agent runs in read-only project mount (default). The agent
#               receives filesystem errors if it attempts to write files.
#   - readwrite: Agent runs in read-write project mount. Use for routes
#                that need to modify code (issue #28).
#
# Timeout overrides (optional per-route, falls back to global env vars):
#   max_wall_clock_seconds: Hard upper-bound run duration (default: 7200)
#   max_inactivity_seconds: Watchdog resets on stdout output only (default: 900).
#                           Stderr is tracked for diagnostics but deliberately
#                           does not stay the timeout, so a retry loop (which
#                           produces only stderr) cannot hold the queue open.
#                           Raise this for a harness that goes quiet for long
#                           stretches, e.g. a local model during a long prefill.
#
# Agent dispatch order (optional per-route):
#   randomize: true   -> shuffle the agents list per matched event so the same
#                        agent does not always run first. Only meaningful on
#                        multi-agent routes (e.g. issue-triage). Defaults to
#                        false. See docs/ROUTES.md for details.
routes:
  # Issue-assignment routes - triggered when an agent is assigned to an issue.
  # GitLab's /assign quick action on an existing issue sends an Issue Hook with
  # action=update; populating the assignee at issue-creation time sends an Issue
  # Hook with action=open. Matching both (action: ["open", "update"]) means an
  # issue created with an agent already assigned dispatches that agent's
  # read-write assign_work route immediately, instead of first going through
  # readonly triage/review. These routes detect agent usernames in the assignees
  # list and grant read-write access for the agent to perform work.
  #
  # Placement matters: resolve_match returns the FIRST matching route, so these
  # must sit ABOVE issue-triage (and any issue-update fallback). Otherwise a
  # create-with-assignee event would fall through to the readonly issue-triage
  # review. This is deliberately either/or -- an issue created with an agent
  # assigned skips triage and goes straight to work.
  #
  # Assign-on-creation can be disabled with ENABLE_ASSIGN_ON_ISSUE_CREATION=false
  # (default true), which reverts creation events to triage. The /assign-on-an-
  # existing-issue path (action=update) is unaffected by that toggle.
  - name: assign-issue-claude
    access: readwrite
    match:
      event: "Issue Hook"
      action: ["open", "update"]
      author: "your-username"
      assignees: ["claude"]
    agents:
      - agent: "claude"
        task: "assign_work"
        prompt: "assign_work.txt"
        options:
          command: "claude"
          args: ["--model", "${CLAUDE_MODEL}", "--dangerously-skip-permissions", "-p"]
  - name: assign-issue-gemini
    access: readwrite
    match:
      event: "Issue Hook"
      action: ["open", "update"]
      author: "your-username"
      assignees: ["gemini"]
    agents:
      - agent: "gemini"
        task: "assign_work"
        prompt: "assign_work.txt"
        options:
          command: "agy"
          args: ["--model", "${GEMINI_MODEL}", "--dangerously-skip-permissions", "-p", "${PROMPT}"]
  - name: assign-issue-codex
    access: readwrite
    match:
      event: "Issue Hook"
      action: ["open", "update"]
      author: "your-username"
      assignees: ["codex"]
    agents:
      - agent: "codex"
        task: "assign_work"
        prompt: "assign_work.txt"
        options:
          command: "codex"
          args: ["--model", "${CODEX_MODEL}", "exec", "--yolo", "--skip-git-repo-check"]
# OpenCode issue-assignment route (optional, disabled by default). Read-write
